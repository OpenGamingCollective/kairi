[workspace]
resolver = "3"
members = ["kairi"]


[workspace.package]
version = "0.1.0"
authors = ["luytan <luytan@khora.me>"]
repository = "https://github.com/OpenGamingCollective/ogc-bot"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0"
description = "OpenGamingCollective general purpose bot"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full", "tracing"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
toml = "1.0.3"
strum = { version = "0.28", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.21"
kameo = { version = "0.22.2", features = ["console"] }
poise = "0.7.1"
typesafe-api = { git = "https://github.com/luytan/typesafe-api" }
